[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "se-pov-builder"
version = "0.2.0"
description = "SE Demo & POV Builder: plan and track technical sales engagements (community tool, not an official LogicMonitor product)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.6,<3",
  "pyyaml>=6.0,<7",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.5",
]

[project.scripts]
se-pov-builder = "se_pov_builder.__main__:main"
se-pov-builder-validate = "se_pov_builder.validate_content:main"

[tool.setuptools.packages.find]
include = ["se_pov_builder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# SQLAlchemy warnings point at real mapping problems (e.g. rows deleted twice), so fail on them.
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
